[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os

# The real URL is injected from Settings by erpnext_agent.migrate / migrations/env.py.
# Keeping credentials out of this file prevents accidental commits of secrets.
sqlalchemy.url = postgresql+asyncpg://invalid:invalid@invalid/invalid

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
