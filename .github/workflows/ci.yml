name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q

      - name: Offline policy evaluation
        run: uv run python -m erpnext_agent.evaluation.runner
