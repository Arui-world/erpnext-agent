name: erpnext-agent

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    ports:
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: erpnext-agent:local
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-erpnext_agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erpnext_agent}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
    command: ["python", "-m", "erpnext_agent.migrate", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: erpnext-agent:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-erpnext_agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erpnext_agent}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
    ports:
      - "${APP_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - erpnext
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3); urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  eval:
    build:
      context: .
      dockerfile: Dockerfile
    image: erpnext-agent:local
    restart: "no"
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-erpnext_agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erpnext_agent}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OTEL_ENABLED: "false"
    command:
      [
        "python",
        "-m",
        "erpnext_agent.evaluation.runner",
        "--suite",
        "evaluations/scenarios/online_authenticated_v1.json",
        "--repeat",
        "${EVAL_REPEAT:-1}",
        "--json-report",
        "evaluations/reports/online_authenticated_v1.json",
        "--markdown-report",
        "evaluations/reports/online_authenticated_v1.md",
      ]
    volumes:
      - ./evaluations/reports:/app/evaluations/reports
    depends_on:
      agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - erpnext

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erpnext_agent}
      POSTGRES_USER: ${POSTGRES_USER:-erpnext_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:

networks:
  erpnext:
    external: true
    name: ${FRAPPE_DOCKER_NETWORK:-frappe_docker_devcontainer_default}
